
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x2="0" y2="1">
    <stop stop-color="#24191E"></stop>
    <stop offset="1" stop-color="#120F13"></stop>
  </linearGradient>
  <linearGradient id="skin" x1=".12" y1="0" x2=".85" y2="1">
    <stop stop-color="#A5A36D"></stop>
    <stop offset=".25" stop-color="#77794B"></stop>
    <stop offset=".58" stop-color="#53563A"></stop>
    <stop offset=".82" stop-color="#343C2D"></stop>
    <stop offset="1" stop-color="#242C24"></stop>
  </linearGradient>
  <radialGradient id="skinLight" cx=".3" cy=".22" r=".8">
    <stop stop-color="#D0C18B" stop-opacity=".65"></stop>
    <stop offset=".45" stop-color="#A4A06B" stop-opacity=".12"></stop>
    <stop offset="1" stop-color="#1D281E" stop-opacity=".5"></stop>
  </radialGradient>
  <linearGradient id="flesh" x1=".2" y1="0" x2=".8" y2="1">
    <stop stop-color="#FFF1D3"></stop>
    <stop offset=".35" stop-color="#E8D5AC"></stop>
    <stop offset=".75" stop-color="#D6BD8E"></stop>
    <stop offset="1" stop-color="#B99B6D"></stop>
  </linearGradient>
  <radialGradient id="center" cx=".5" cy=".5" r=".55">
    <stop stop-color="#E9A66D"></stop>
    <stop offset=".45" stop-color="#D18B64"></stop>
    <stop offset="1" stop-color="#BD785B" stop-opacity="0"></stop>
  </radialGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#B2B77A"></stop>
    <stop offset=".55" stop-color="#697B4A"></stop>
    <stop offset="1" stop-color="#364A32"></stop>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="9"></feGaussianBlur>
  </filter>
  <pattern id="seeds" width="31" height="29" patternUnits="userSpaceOnUse">
    <ellipse cx="7" cy="8" rx="1.6" ry="3.1" fill="#93674C" opacity=".8" transform="rotate(-24 7 8)"></ellipse>
    <ellipse cx="23" cy="18" rx="1.5" ry="2.8" fill="#A16F4B" opacity=".75" transform="rotate(25 23 18)"></ellipse>
    <ellipse cx="13" cy="26" rx="1.2" ry="2.2" fill="#B77D52" opacity=".7"></ellipse>
  </pattern>
  <clipPath id="inside">
    <path d="M256 154 C216 154 183 176 166 208 C146 244 153 287 169 318 C187 353 219 375 256 385 C293 375 325 353 343 318 C359 287 366 244 346 208 C329 176 296 154 256 154Z"></path>
  </clipPath>
</defs>

<!-- Background -->
<rect width="512" height="512" rx="105" fill="url(#bg)"></rect>

<!-- Ground shadow -->
<ellipse cx="257" cy="426" rx="132" ry="17" fill="#090B08" opacity=".65" filter="url(#shadow)"></ellipse>

<!-- Stem -->
<path d="M252 111 C249 89 252 67 264 43 C270 67 268 91 259 113Z" fill="#536440"></path>
<path d="M257 106 Q258 79 264 52" fill="none" stroke="#B4B47A" stroke-width="2" opacity=".65"></path>

<!-- Leaf -->
<path d="M258 92 C231 65 205 73 196 96 C216 112 240 109 258 92Z" fill="url(#leaf)"></path>
<path d="M200 96 Q229 91 257 92" fill="none" stroke="#C2C28B" stroke-width="2" opacity=".65"></path>

<!-- Fig body -->
<path d="M256 112
C211 112 163 130 133 164
C103 198 91 241 101 286
C111 342 151 386 197 408
C218 418 239 425 256 430
C273 425 294 418 315 408
C361 386 401 342 411 286
C421 241 409 198 379 164
C349 130 301 112 256 112Z" fill="url(#skin)"></path>

<!-- Outer natural light -->
<path d="M256 112
C211 112 163 130 133 164
C103 198 91 241 101 286
C111 342 151 386 197 408
C218 418 239 425 256 430
C273 425 294 418 315 408
C361 386 401 342 411 286
C421 241 409 198 379 164
C349 130 301 112 256 112Z" fill="url(#skinLight)"></path>

<!-- Skin subtle natural highlights -->
<path d="M147 181 C121 220 119 272 137 312" fill="none" stroke="#C0B77E" stroke-width="5" opacity=".15" stroke-linecap="round"></path>
<path d="M162 157 Q201 127 233 132" fill="none" stroke="#E2D39D" stroke-width="4" opacity=".18" stroke-linecap="round"></path>

<!-- Cut surface rim -->
<path d="M256 145 C212 145 176 165 156 200 C132 241 139 292 157 326 C177 364 214 391 256 401 C298 391 335 364 355 326 C373 292 380 241 356 200 C336 165 300 145 256 145Z" fill="#A5A078"></path>

<!-- Cream flesh -->
<path d="M256 153 C216 153 183 176 166 208 C146 244 153 287 169 318 C187 353 219 375 256 385 C293 375 325 353 343 318 C359 287 366 244 346 208 C329 176 296 153 256 153Z" fill="url(#flesh)"></path>

<!-- Flesh center -->
<g clip-path="url(#inside)">
  <ellipse cx="256" cy="277" rx="104" ry="119" fill="url(#center)"></ellipse>
  <path d="M256 180 C243 218 242 326 256 374" stroke="#FFF4D8" stroke-width="3" opacity=".28" fill="none"></path>
  <ellipse cx="256" cy="275" rx="89" ry="100" fill="url(#seeds)" opacity=".9"></ellipse>
  <!-- Organic seed center -->
  <path d="M256 235 C230 248 224 271 234 293 C241 310 251 323 256 331 C261 323 271 310 278 293 C288 271 282 248 256 235Z" fill="#C98562" opacity=".22"></path>
  <g fill="#8D5944">
    <ellipse cx="237" cy="250" rx="2" ry="3" transform="rotate(-25 237 250)"></ellipse>
    <ellipse cx="270" cy="247" rx="2" ry="3" transform="rotate(24 270 247)"></ellipse>
    <ellipse cx="253" cy="262" rx="2" ry="3"></ellipse>
    <ellipse cx="225" cy="282" rx="2" ry="3" transform="rotate(30 225 282)"></ellipse>
    <ellipse cx="286" cy="278" rx="2" ry="3"></ellipse>
    <ellipse cx="242" cy="302" rx="2" ry="3"></ellipse>
    <ellipse cx="269" cy="315" rx="2" ry="3"></ellipse>
    <ellipse cx="253" cy="340" rx="2" ry="3"></ellipse>
    <ellipse cx="296" cy="303" rx="2" ry="3"></ellipse>
    <ellipse cx="216" cy="312" rx="2" ry="3"></ellipse>
  </g>
</g>

<!-- Fine edge highlight -->
<path d="M173 202 C194 169 225 153 256 153 C287 153 318 169 339 202" fill="none" stroke="#FFF2D3" stroke-width="2" opacity=".48" stroke-linecap="round"></path>

</svg>
